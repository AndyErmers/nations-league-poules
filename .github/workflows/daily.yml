name: Daily Nations League predictions

on:
  schedule:
    # 07:00 UTC = 09:00 CEST (zomertijd) / 08:00 CET (wintertijd) in Nederland.
    - cron: "0 7 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run:
    # Sofascore blokkeert cloud/datacenter-IP's (bevestigd op GitHub-hosted
    # ubuntu-latest runners met een 403 Forbidden op alle endpoints) — deze
    # job draait daarom op een self-hosted runner op een thuis-IP.
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        run: python -m pip install -r requirements.txt

      - name: Run daily pipeline
        shell: bash
        run: python -m predictor.weekly_pipeline

      - name: Commit and push updated data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/matches_raw.csv data/matches_clean.csv data/fifa_rankings.csv data/fifa_rankings_history.csv data/training_data.csv predictor/artifacts/next_predictions.csv predictor/artifacts/weekly_email.txt
          git diff --cached --quiet || git commit -m "Daily Nations League data refresh and predictions"
          git push

      - name: Send predictions email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.GMAIL_ADDRESS }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "Nations League voorspellingen – komende 10 wedstrijden"
          to: andy.ermers@gmail.com
          from: "Nations League Predictor <${{ secrets.GMAIL_ADDRESS }}>"
          body: file://predictor/artifacts/weekly_email.txt

      - name: Send failure email
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.GMAIL_ADDRESS }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "Nations League pipeline gefaald"
          to: andy.ermers@gmail.com
          from: "Nations League Predictor <${{ secrets.GMAIL_ADDRESS }}>"
          body: |
            De dagelijkse Nations League pipeline is gefaald.
            Bekijk de logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
